services:
  # Database Container (MongoDB)
  mongo:
    image: mongo:latest
    container_name: drivealert-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-drivealert}
    volumes:
      - mongo_data:/data/db
    networks:
      - drivealert_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Server (FastAPI)
  backend:
    image: europe-north1-docker.pkg.dev/project-e1e729b0-f8fc-4ba6-ae8/drivealert-eu/drivealert-backend:latest
    container_name: drivealert-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/drivealert}
      - DATABASE_NAME=${DATABASE_NAME:-drivealert}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - drivealert_network

  # Frontend Client (React + Vite + Nginx)
  frontend:
    image: europe-north1-docker.pkg.dev/project-e1e729b0-f8fc-4ba6-ae8/drivealert-eu/drivealert-frontend:latest
    container_name: drivealert-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      API_PROXY_PASS: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - drivealert_network

volumes:
  mongo_data:
    driver: local

networks:
  drivealert_network:
    driver: bridge
