steps:
  # 1. בניית תמונת ה-Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:$COMMIT_SHA'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend/'


  # 2. דחיפת התמונה למאגר הקיים
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:$COMMIT_SHA'

  # 3. פריסה אוטומטית ל-Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drivealert-backend'
      - '--image'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'


images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:$COMMIT_SHA'
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-backend:latest'