steps:
  # 1. בניית תמונת ה-Docker של ה-Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/drivealert-frontend:$COMMIT_SHA'
      - '-f'
      - 'frontend/Dockerfile'  # יש לעדכן לנתיב ה-Dockerfile של ה-frontend
      - 'frontend/'           # יש לעדכן לתיקיית הקוד של ה-frontend


  # 2. דחיפת התמונה
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/drivealert-frontend:$COMMIT_SHA']


  # 3. פריסה אוטומטית ל-Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drivealert-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/drivealert-frontend:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'


images:
  - 'gcr.io/$PROJECT_ID/drivealert-frontend:$COMMIT_SHA'