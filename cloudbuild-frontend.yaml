steps:
  # 1. בניית תמונת ה-Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:$COMMIT_SHA'
      - '-t'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend/'

  # 2. דחיפת התמונה ל-Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:$COMMIT_SHA'

  # 3. פריסה ל-Cloud Run תוך הגדרת פורט 80 במפורש
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drivealert-frontend'
      - '--image'
      - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'
      - '--port'
      - '80'

images:
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:$COMMIT_SHA'
  - 'europe-north1-docker.pkg.dev/$PROJECT_ID/drivealert-eu/drivealert-frontend:latest'
