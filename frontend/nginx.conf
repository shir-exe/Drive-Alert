server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy API requests to the Cloud Run backend
    location /api/ {
        resolver 8.8.8.8 valid=300s ipv6=off;
        set $backend_host drivealert-backend-43588904687.europe-north1.run.app;
        proxy_pass https://$backend_host;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # הגדלת גודל החוצץ לקריאת Headers מה-Backend
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # React/Vite SPA: כל נתיב אחר מוחזר ל-index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}