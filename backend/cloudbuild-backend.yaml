steps:
  # 1. בניית תמונת ה-Docker של ה-Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/drivealert-backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'   # יש לעדכן לנתיב ה-Dockerfile של ה-backend
      - 'backend/'            # יש לעדכן לתיקיית הקוד של ה-backend


  # 2. דחיפת התמונה
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/drivealert-backend:$COMMIT_SHA']


  # 3. פריסה אוטומטית ל-Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'drivealert-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/drivealert-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'


images:
  - 'gcr.io/$PROJECT_ID/drivealert-backend:$COMMIT_SHA'